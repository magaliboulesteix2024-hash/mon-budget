<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mon Budget">
<title>Mon Budget</title>
<style>
:root{
  --bg:#141a26; --card:#1e2636; --card2:#252f44; --accent:#7c6cf0; --accent2:#00d9a3;
  --warn:#ffb74d; --danger:#ff5c7a; --text:#f0f2f8; --sub:#8b93a7; --border:#2c3650;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--text);padding-bottom:90px;}
h1,h2,h3{margin:0 0 8px;font-weight:600;}
button{font-family:inherit;cursor:pointer;border:none;border-radius:10px;padding:10px 14px;background:var(--accent);color:#fff;font-size:14px;}
button.secondary{background:var(--card2);color:var(--text);}
button.danger{background:var(--danger);}
button.ghost{background:transparent;color:var(--accent);padding:4px 8px;}
input,select,textarea{font-family:inherit;background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:9px 10px;font-size:14px;width:100%;}
label{font-size:12px;color:var(--sub);display:block;margin-bottom:4px;}
.field{margin-bottom:12px;}
.checkfield{display:flex;align-items:center;gap:8px;margin:10px 0;}
.checkfield input{width:auto;}
.topbar{position:sticky;top:0;background:var(--bg);z-index:50;padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);}
.topbar h2{font-size:17px;}
.month-nav{display:flex;align-items:center;gap:6px;font-size:13px;}
.month-nav button{padding:6px 10px;font-size:13px;}
.container{padding:14px;max-width:640px;margin:0 auto;}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px;border:1px solid var(--border);}
.card h3{font-size:13px;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;}
.big-number{font-size:30px;font-weight:700;}
.positive{color:var(--accent2);}
.negative{color:var(--danger);}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);gap:8px;}
.row:last-child{border-bottom:none;}
.row-title{font-size:14px;}
.row-sub{font-size:11px;color:var(--sub);margin-top:2px;}
.row-amount{font-weight:600;white-space:nowrap;}
.pill{font-size:11px;padding:4px 10px;border-radius:20px;background:var(--card2);color:var(--sub);white-space:nowrap;}
.pill.ok{background:rgba(0,217,163,.18);color:var(--accent2);}
.progress-bar{height:8px;border-radius:6px;background:var(--card2);overflow:hidden;margin-top:8px;}
.progress-fill{height:100%;background:var(--accent);border-radius:6px;transition:width .3s;}
.block-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.block{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;cursor:pointer;position:relative;}
.block h4{font-size:14px;margin-bottom:6px;}
.block .amt{font-size:18px;font-weight:700;}
.block .sub{font-size:11px;color:var(--sub);margin-top:2px;}
.block-edit{position:absolute;top:8px;right:8px;background:var(--card2);border-radius:8px;padding:2px 8px;font-size:11px;color:var(--sub);}
.add-block{border:2px dashed var(--border);display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:28px;min-height:70px;background:transparent;}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:6px 0 18px;z-index:100;}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--sub);font-size:9px;background:none;padding:4px 4px;border-radius:8px;}
.nav-item.active{color:var(--accent);}
.nav-item .icon{font-size:18px;}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:flex-end;justify-content:center;}
.modal{background:var(--card);border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:640px;max-height:88vh;overflow-y:auto;position:relative;}
.modal-handle{width:40px;height:4px;background:var(--border);border-radius:4px;margin:0 auto 14px;}
.btn-row{display:flex;gap:8px;margin-top:14px;}
.btn-row button{flex:1;}
.add-btn{position:fixed;bottom:92px;right:18px;width:54px;height:54px;border-radius:50%;font-size:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(124,108,240,.5);z-index:90;}
.empty-state{text-align:center;color:var(--sub);padding:24px 10px;font-size:13px;}
.chart-wrap{display:flex;justify-content:center;margin:10px 0;}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;justify-content:center;}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--sub);}
.legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
.alert-box{background:rgba(255,92,122,.12);border:1px solid var(--danger);border-radius:12px;padding:12px;margin-bottom:14px;font-size:13px;color:var(--danger);}
.freq-select{display:flex;gap:6px;flex-wrap:wrap;}
.freq-select button{flex:1;min-width:70px;font-size:12px;padding:8px 4px;}
.freq-select button.active{background:var(--accent);color:#fff;}
.close-x{position:absolute;top:14px;right:16px;background:var(--card2);width:28px;height:28px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:14px;}
.subtype-tag{font-size:10px;padding:2px 8px;border-radius:6px;margin-right:6px;display:inline-block;}
.subtype-matelas{background:rgba(124,108,240,.2);color:var(--accent);}
.subtype-projet{background:rgba(0,217,163,.2);color:var(--accent2);}
.subtype-charge{background:rgba(255,183,77,.2);color:var(--warn);}
.bubble{border-radius:16px;padding:14px;margin-bottom:10px;cursor:pointer;border:2px solid var(--border);background:var(--card2);}
.bubble.done{border-color:var(--accent2);background:rgba(0,217,163,.08);}
.badge-atteint{background:rgba(0,217,163,.2);color:var(--accent2);font-size:10px;padding:2px 8px;border-radius:20px;margin-left:6px;}
.chip-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.chip{background:var(--card2);border:1px solid var(--border);border-radius:20px;padding:6px 12px;font-size:12px;cursor:pointer;color:var(--text);}
.chip.selected{background:var(--accent);color:#fff;border-color:var(--accent);}
.chip-del{margin-left:6px;color:var(--danger);cursor:pointer;}
.section-title{font-size:15px;font-weight:600;margin:18px 0 10px;}
.section-title:first-child{margin-top:0;}
</style>
</head>
<body>

<div class="topbar">
  <h2 id="pageTitle">Tableau de bord</h2>
  <div class="month-nav">
    <button class="secondary" onclick="changeMonth(-1)">‹</button>
    <span id="monthLabel" style="min-width:100px;text-align:center;"></span>
    <button class="secondary" onclick="changeMonth(1)">›</button>
  </div>
</div>

<div class="container" id="mainContainer"></div>

<button class="add-btn" id="addBtn" onclick="handleAdd()" style="display:none;">+</button>

<div class="bottom-nav">
  <button class="nav-item active" data-page="dashboard" onclick="goPage('dashboard')"><span class="icon">🏠</span>Accueil</button>
  <button class="nav-item" data-page="ressources" onclick="goPage('ressources')"><span class="icon">💰</span>Ressources</button>
  <button class="nav-item" data-page="charges" onclick="goPage('charges')"><span class="icon">🧾</span>Charges</button>
  <button class="nav-item" data-page="alim" onclick="goPage('alim')"><span class="icon">🛒</span>Alim/Auto</button>
  <button class="nav-item" data-page="epargne" onclick="goPage('epargne')"><span class="icon">🏦</span>Épargne</button>
  <button class="nav-item" data-page="loisirs" onclick="goPage('loisirs')"><span class="icon">🎉</span>Loisirs</button>
</div>

<div id="modalRoot"></div>

<script>
/* ================= STORAGE & MODEL ================= */
const DB_KEY = 'monBudgetData_v2';
function uid(){ return 'id'+Math.random().toString(36).slice(2,10); }

function defaultChargesCategories(){
  return ['Logement','Assurance','Abonnements','Mobile/Internet','Impôts','Divers'].map(n=>({id:uid(),nom:n,items:[]}));
}
function defaultLoisirsCategories(){
  return [
    {id:uid(), nom:'Sorties', items:['Restaurant','Café','Bar','Cinéma','Concert','Spectacle','Autre']},
    {id:uid(), nom:'Bien-être', items:['Coiffeur','Esthéticienne','Piscine','Médecine douce','Psychologue','Autre']},
    {id:uid(), nom:'Shopping', items:['Chaussures','Vêtements','Bijoux','Beauté','Déco/Maison','Bricolage','Loisirs créatifs','High-tech','Culture','Voyage','Autre']},
    {id:uid(), nom:'Cadeaux', items:['Noël','Anniversaire','Occasion spéciale','Autre']}
  ];
}
function defaultAlimCategories(){
  return [
    {id:uid(), nom:'Alimentation', items:['Supermarché','Drive','Boulangerie','Marché','Épicerie fine','Autre']},
    {id:uid(), nom:'Voiture', items:['Essence','Parking','Péage','Vidange','Contrôle technique','Réparations','Autre']}
  ];
}

function emptyMonth(prevMonth){
  if(!prevMonth){
    return {
      salaire: 0,
      autresRessources: [],
      chargesCategories: defaultChargesCategories(),
      epargne: [
        {id: uid(), nom:"Matelas de sécurité", sousType:"matelas", compte:"", objectif:null, cumule:0, montantMoisCi:0, valide:false, chargeLieeId:null, hidden:false, atteint:false, historique:[]}
      ],
      loisirsCategories: defaultLoisirsCategories(),
      loisirsDepenses: [],
      alimCategories: defaultAlimCategories(),
      alimDepenses: [],
      seuilAlerteLoisirs: 40
    };
  }
  const clone = JSON.parse(JSON.stringify(prevMonth));
  // reset validations mensuelles
  clone.chargesCategories.forEach(cat=>{
    cat.items.forEach(it=>{ if(it.frequence!=='mensuel') it.valide = false; });
  });
  clone.epargne = clone.epargne.map(e=>({...e, valide:false, montantMoisCi:0}));
  clone.loisirsDepenses = [];
  clone.alimDepenses = [];
  return clone;
}

function loadDB(){
  let raw = localStorage.getItem(DB_KEY);
  if(!raw){
    const now = new Date();
    const key = monthKey(now);
    const db = { currentMonth: key, months: {} };
    db.months[key] = emptyMonth(null);
    localStorage.setItem(DB_KEY, JSON.stringify(db));
    return db;
  }
  return JSON.parse(raw);
}
function saveDB(){ localStorage.setItem(DB_KEY, JSON.stringify(state.db)); }

function monthKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function monthLabel(key){
  const [y,m] = key.split('-').map(Number);
  const noms = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
  return noms[m-1]+' '+y;
}

let state = { db: loadDB(), page: 'dashboard', viewedMonth: null };
state.viewedMonth = state.db.currentMonth;
ensureMonthExists(state.viewedMonth);

function ensureMonthExists(key){
  if(!state.db.months[key]){
    const keys = Object.keys(state.db.months).sort();
    const prevKey = keys.filter(k=>k<key).pop();
    const prev = prevKey ? state.db.months[prevKey] : null;
    state.db.months[key] = emptyMonth(prev);
    saveDB();
  }
}
function curMonth(){ return state.db.months[state.viewedMonth]; }

function changeMonth(delta){
  const [y,m] = state.viewedMonth.split('-').map(Number);
  const d = new Date(y, m-1+delta, 1);
  const key = monthKey(d);
  ensureMonthExists(key);
  state.viewedMonth = key;
  render();
}

/* ================= CALCULS ================= */
const cycleMonths = {trimestriel:3, semestriel:6, annuel:12, mensuel:1};

function monthlyAmount(item){
  if(item.frequence==='mensuel') return item.montant;
  return item.lissage ? item.montant / cycleMonths[item.frequence] : item.montant;
}
function allChargeItems(m){
  let arr = [];
  m.chargesCategories.forEach(cat=> cat.items.forEach(it=> arr.push({...it, catNom:cat.nom, catId:cat.id})));
  return arr;
}
function totalRessources(m){ return m.salaire + m.autresRessources.reduce((s,r)=>s+r.montant,0); }
function totalChargesValidees(m){
  return allChargeItems(m).filter(it=>{
    if(it.lissage) return false; // lissée compte via épargne
    if(it.frequence==='mensuel') return true;
    return it.valide;
  }).reduce((s,it)=>s+monthlyAmount(it),0);
}
function totalChargesTheoriques(m){
  return allChargeItems(m).reduce((s,it)=>s+monthlyAmount(it),0);
}
function totalEpargneValidee(m){ return m.epargne.filter(e=>e.valide).reduce((s,e)=>s+e.montantMoisCi,0); }
function totalLoisirsValides(m){ return m.loisirsDepenses.reduce((s,d)=>s+d.montant,0); }
function totalAlimValides(m){ return m.alimDepenses.reduce((s,d)=>s+d.montant,0); }
function resteAVivre(m){
  return totalRessources(m) - totalChargesValidees(m) - totalEpargneValidee(m) - totalLoisirsValides(m) - totalAlimValides(m);
}
function suggestionEpargne(m){ return m.salaire*0.20; }
function suggestionLoisirs(m){ return m.salaire*0.30; }
function suggestionCharges(m){ return m.salaire*0.50; }
function suggestionAlim(m){
  return Math.max(0, suggestionCharges(m) - totalChargesValidees(m));
}
function budgetLoisirsRestant(m){ return suggestionLoisirs(m) - totalLoisirsValides(m); }
function budgetAlimRestant(m){ return suggestionAlim(m) - totalAlimValides(m); }

/* ================= NAVIGATION ================= */
function goPage(p){
  state.page = p;
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active', b.dataset.page===p));
  render();
}

function render(){
  document.getElementById('monthLabel').textContent = monthLabel(state.viewedMonth);
  const titles = {dashboard:'Tableau de bord', ressources:'Ressources', charges:'Charges', epargne:'Épargne', loisirs:'Loisirs', alim:'Alimentation & Voiture'};
  document.getElementById('pageTitle').textContent = titles[state.page];
  const addBtn = document.getElementById('addBtn');
  addBtn.style.display = ['ressources','charges','epargne'].includes(state.page) ? 'flex' : 'none';

  const c = document.getElementById('mainContainer');
  if(state.page==='dashboard') c.innerHTML = renderDashboard();
  else if(state.page==='ressources') c.innerHTML = renderRessources();
  else if(state.page==='charges') c.innerHTML = renderCharges();
  else if(state.page==='epargne') c.innerHTML = renderEpargne();
  else if(state.page==='loisirs') c.innerHTML = renderVariable(m=>m.loisirsCategories, m=>m.loisirsDepenses, 'loisirs', suggestionLoisirs, totalLoisirsValides, 'Budget loisirs (30% du salaire)');
  else if(state.page==='alim') c.innerHTML = renderVariable(m=>m.alimCategories, m=>m.alimDepenses, 'alim', suggestionAlim, totalAlimValides, 'Budget Alimentation & Voiture');

  if(state.page==='dashboard') drawChart();
}

/* ================= DASHBOARD ================= */
function renderDashboard(){
  const m = curMonth();
  const rav = resteAVivre(m);
  const ress = totalRessources(m);
  const chargesVal = totalChargesValidees(m);
  const epVal = totalEpargneValidee(m);
  const epSug = suggestionEpargne(m);
  const loiVal = totalLoisirsValides(m);
  const loiSug = suggestionLoisirs(m);
  const alimVal = totalAlimValides(m);
  const alimSug = suggestionAlim(m);
  const restLoisirs = budgetLoisirsRestant(m);
  const seuil = m.seuilAlerteLoisirs;

  let alertHtml = '';
  if(restLoisirs < seuil){
    alertHtml += `<div class="alert-box">⚠️ Budget loisirs restant faible : ${restLoisirs.toFixed(2)} € (seuil: ${seuil}€)</div>`;
  }
  if(rav < 0){
    alertHtml += `<div class="alert-box">🔴 Reste à vivre négatif !</div>`;
  }

  return `
    ${alertHtml}
    <div class="card">
      <h3>Reste à vivre — ${monthLabel(state.viewedMonth)}</h3>
      <div class="big-number ${rav>=0?'positive':'negative'}">${rav.toFixed(2)} €</div>
      <div class="row-sub" style="margin-top:6px;">Ressources: ${ress.toFixed(2)}€ • Charges: ${chargesVal.toFixed(2)}€ • Épargne: ${epVal.toFixed(2)}€ • Loisirs: ${loiVal.toFixed(2)}€ • Alim/Auto: ${alimVal.toFixed(2)}€</div>
    </div>

    <div class="card">
      <h3>Répartition du mois</h3>
      <div class="chart-wrap"><canvas id="chartCanvas" width="220" height="220" onclick="onChartClick()"></canvas></div>
      <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background:#7c6cf0"></div>Charges (${chargesVal.toFixed(0)}€/${suggestionCharges(m).toFixed(0)}€)</div>
        <div class="legend-item"><div class="legend-dot" style="background:#00d9a3"></div>Épargne (${epVal.toFixed(0)}€/${epSug.toFixed(0)}€)</div>
        <div class="legend-item"><div class="legend-dot" style="background:#ffb74d"></div>Loisirs (${loiVal.toFixed(0)}€/${loiSug.toFixed(0)}€)</div>
        <div class="legend-item"><div class="legend-dot" style="background:#ff5c7a"></div>Alim/Auto (${alimVal.toFixed(0)}€/${alimSug.toFixed(0)}€)</div>
        <div class="legend-item"><div class="legend-dot" style="background:#3a4560"></div>Reste à vivre (${rav.toFixed(0)}€)</div>
      </div>
      <p style="font-size:11px;color:var(--sub);text-align:center;margin-top:8px;">Zones grisées = suggéré non encore validé/dépensé. Touchez le graphique pour le détail.</p>
    </div>

    <div class="card">
      <h3>Résumé loisirs</h3>
      <div class="row"><span class="row-title">Budget restant</span><span class="row-amount ${restLoisirs<seuil?'negative':''}">${restLoisirs.toFixed(2)} €</span></div>
      <div class="progress-bar"><div class="progress-fill" style="width:${loiSug>0?Math.min(100,(loiVal/loiSug)*100):0}%;background:${restLoisirs<seuil?'var(--danger)':'var(--accent)'}"></div></div>
    </div>
  `;
}

function drawChart(){
  const m = curMonth();
  const canvas = document.getElementById('chartCanvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const cx=110, cy=110, r=100;
  ctx.clearRect(0,0,220,220);

  const chargesVal = totalChargesValidees(m);
  const epVal = totalEpargneValidee(m);
  const loiVal = totalLoisirsValides(m);
  const alimVal = totalAlimValides(m);
  const rav = Math.max(0, resteAVivre(m));

  const chargesSug = suggestionCharges(m);
  const epSug = suggestionEpargne(m);
  const loiSug = suggestionLoisirs(m);
  const alimSug = suggestionAlim(m);

  const segs = [
    {val: chargesVal, color:'#7c6cf0'},
    {val: epVal, color:'#00d9a3'},
    {val: loiVal, color:'#ffb74d'},
    {val: alimVal, color:'#ff5c7a'},
    {val: rav, color:'#3a4560'}
  ];
  const ghosts = [
    {val: Math.max(0,chargesSug-chargesVal), color:'rgba(124,108,240,.25)'},
    {val: Math.max(0,epSug-epVal), color:'rgba(0,217,163,.25)'},
    {val: Math.max(0,loiSug-loiVal), color:'rgba(255,183,77,.25)'},
    {val: Math.max(0,alimSug-alimVal), color:'rgba(255,92,122,.25)'}
  ];

  let total = segs.reduce((s,x)=>s+x.val,0) + ghosts.reduce((s,x)=>s+x.val,0);
  if(total<=0) total = 1;

  let angle = -Math.PI/2;
  [...segs, ...ghosts].forEach(s=>{
    const a = (s.val/total)*Math.PI*2;
    ctx.beginPath(); ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,r,angle,angle+a); ctx.closePath();
    ctx.fillStyle = s.color; ctx.fill();
    angle += a;
  });

  ctx.beginPath(); ctx.arc(cx,cy,58,0,Math.PI*2); ctx.fillStyle='#141a26'; ctx.fill();
}

function onChartClick(){ showDetailModal(); }

function showDetailModal(){
  const m = curMonth();
  let rowsC = allChargeItems(m).map(it=>`<div class="row"><div><div class="row-title">${it.nom||it.catNom} <span class="row-sub">(${it.catNom})</span></div><div class="row-sub">${it.frequence}${it.lissage?' • lissée':''}${it.detail?' • '+it.detail:''}</div></div><div class="row-amount">${monthlyAmount(it).toFixed(2)} €</div></div>`).join('') || '<div class="empty-state">Aucune charge</div>';
  let rowsE = m.epargne.filter(e=>e.valide).map(e=>`<div class="row"><div><div class="row-title">${e.nom}</div><div class="row-sub">${e.sousType}</div></div><div class="row-amount">${e.montantMoisCi.toFixed(2)} €</div></div>`).join('') || '<div class="empty-state">Aucun versement épargne validé</div>';
  let rowsL = m.loisirsDepenses.map(d=>`<div class="row"><div><div class="row-title">${d.itemNom}</div><div class="row-sub">${d.catNom}${d.detail?' • '+d.detail:''}</div></div><div class="row-amount">${d.montant.toFixed(2)} €</div></div>`).join('') || '<div class="empty-state">Aucune dépense loisirs</div>';
  let rowsA = m.alimDepenses.map(d=>`<div class="row"><div><div class="row-title">${d.itemNom}</div><div class="row-sub">${d.catNom}${d.detail?' • '+d.detail:''}</div></div><div class="row-amount">${d.montant.toFixed(2)} €</div></div>`).join('') || '<div class="empty-state">Aucune dépense alim/auto</div>';

  openModal(`
    <button class="close-x" onclick="closeModal()">✕</button>
    <h3>Détail du mois — ${monthLabel(state.viewedMonth)}</h3>

function deleteChargeItem(catId,itemId){

function openChargeItemForm(catId, itemId){
  const cat = curMonth().chargesCategories.find(c=>c.id===catId);
  const isNew = !itemId;
  const it = isNew ? {id:uid(), nom:'', montant:0, frequence:'mensuel', lissage:false, valide:false, epargneId:null, detail:''} : cat.items.find(x=>x.id===itemId);
  openModal(`

      <div class="freq-select">
        <button type="button" class="${it.frequence==='mensuel'?'active':''}" onclick="selectFreq('mensuel')">Mensuel</button>
        <button type="button" class="${it.frequence==='trimestriel'?'active':''}" onclick="selectFreq('trimestriel')">Trimestriel</button>
        <button type="button" class="${it.frequence==='semestriel'?'active':''}" onclick="selectFreq('semestriel')">Semestriel</button>
        <button type="button" class="${it.frequence==='annuel'?'active':''}" onclick="selectFreq('annuel')">Annuel</button>
      </div>
      <input type="hidden" id="cFrequence" value="${it.frequence}">
    </div>
    <div class="field" id="lissageField" style="${it.frequence==='mensuel'?'display:none;':''}">
      <div class="checkfield"><input type="checkbox" id="cLissage" ${it.lissage?'checked':''}><label style="margin:0;">Lissage automatique (épargne mensuelle liée)</label></div>
    </div>
    <div class="field"><label>Détail (optionnel)</label><input id="cDetail" value="${it.detail||''}" placeholder="ex: précision"></div>
    <div class="btn-row">
      <button class="secondary" onclick="closeModal()">Annuler</button>
      <button onclick="saveChargeItem('${catId}','${it.id}', ${isNew})">Enregistrer</button>
    </div>
  `);
}
function selectFreq(f){
  document.getElementById('cFrequence').value = f;
  document.querySelectorAll('.freq-select button').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('lissageField').style.display = (f==='mensuel') ? 'none' : 'block';
}
function saveChargeItem(catId, id, isNew){
  const m = curMonth();
  const cat = m.chargesCategories.find(c=>c.id===catId);
  const nom = document.getElementById('cNom').value.trim() || 'Charge';
  const montant = parseFloat(document.getElementById('cMontant').value)||0;
  const frequence = document.getElementById('cFrequence').value;
  const lissage = frequence!=='mensuel' && document.getElementById('cLissage').checked;
  const detail = document.getElementById('cDetail').value.trim();

  let it = cat.items.find(x=>x.id===id);
  if(!it){
    it = {id, nom, montant, frequence, lissage, valide:false, epargneId:null, detail};
    cat.items.push(it);
    if(lissage){
      const ep = {id:uid(), nom:it.nom, sousType:'charge', compte:'', objectif:it.montant, cumule:0, montantMoisCi:0, valide:false, chargeLieeId:it.id, hidden:false, atteint:false, historique:[]};
      m.epargne.push(ep);
      it.epargneId = ep.id;
    }
  } else {
    it.nom=nom; it.montant=montant; it.frequence=frequence; it.detail=detail;
    const wasLissee = it.lissage;
    it.lissage = lissage;
    if(!wasLissee && lissage){
      const ep = {id:uid(), nom:it.nom, sousType:'charge', compte:'', objectif:it.montant, cumule:0, montantMoisCi:0, valide:false, chargeLieeId:it.id, hidden:false, atteint:false, historique:[]};
      m.epargne.push(ep);
      it.epargneId = ep.id;
    }
    if(wasLissee && !lissage && it.epargneId){
      m.epargne = m.epargne.filter(e=>e.id!==it.epargneId);
      it.epargneId = null;
    }
  }
  if(it.lissage && it.epargneId){
    const ep = m.epargne.find(e=>e.id===it.epargneId);
    if(ep){ ep.objectif = it.montant; if(!ep._renamed) ep.nom = it.nom; }
  }
  saveDB(); closeModal(); openChargeCategory(catId); render();
}

function renderEpargne(){
  const m = curMonth();
  const epVal = totalEpargneValidee(m);
  const epSug = suggestionEpargne(m);
  const matelas = m.epargne.filter(e=>e.sousType==='matelas');
  const projets = m.epargne.filter(e=>e.sousType==='projet' && !e.hidden);
  const projetsAtteints = m.epargne.filter(e=>e.sousType==='projet' && e.hidden);
  const chargesLissees = m.epargne.filter(e=>e.sousType==='charge');

  return `
    <div class="card">
      <h3>Suggestion 20% (épargne)</h3>
      <div class="big-number">${epSug.toFixed(2)} €</div>
      <div class="row-sub">Validé ce mois : ${epVal.toFixed(2)} €</div>
    </div>
    <div class="section-title">Matelas de sécurité</div>
    ${matelas.map(e=>renderEpargneBubble(e)).join('')}
    <div class="section-title">Projets</div>
    ${projets.map(e=>renderEpargneBubble(e)).join('') || '<div class="empty-state">Aucun projet. Touchez + pour en créer un.</div>'}
    ${projetsAtteints.length ? `<button class="secondary" style="margin-top:6px;" onclick="showAtteintsModal()">Voir projets atteints (${projetsAtteints.length})</button>` : ''}
    <div class="section-title">Charges lissées</div>
    ${chargesLissees.map(e=>renderEpargneBubble(e)).join('') || '<div class="empty-state">Aucune charge lissée active.</div>'}
  `;
}
function renderEpargneBubble(e){
  const tagClass = 'subtype-'+e.sousType;
  const tagLabel = e.sousType==='matelas'?'Matelas':e.sousType==='projet'?'Projet':'Charge liée';
  const pct = e.objectif ? Math.min(100,(e.cumule/e.objectif)*100) : 0;
  return `
    <div class="bubble ${e.valide?'done':''}" onclick="openEpargneDetail('${e.id}')">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div>
          <span class="subtype-tag ${tagClass}">${tagLabel}</span>
          <span class="row-title">${e.nom}</span>${e.atteint?'<span class="badge-atteint">Atteint</span>':''}
        </div>
        <span class="pill ${e.valide?'ok':''}">${e.valide?'Versé ✓':'À verser'}</span>
      </div>
      ${e.objectif ? `<div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div><div class="row-sub" style="margin-top:4px;">${e.cumule.toFixed(2)}€ / ${e.objectif.toFixed(2)}€</div>` : `<div class="row-sub" style="margin-top:4px;">Cumulé: ${e.cumule.toFixed(2)}€ (sans objectif)</div>`}
    </div>
  `;
}
function openEpargneDetail(id){
  const m = curMonth();
  const e = m.epargne.find(x=>x.id===id);
  const chargeLiee = e.chargeLieeId ? allChargeItems(m).find(c=>c.id===e.chargeLieeId) : null;
  const histo = (e.historique||[]).slice().reverse().map(h=>`<div class="row"><div class="row-title">${monthLabel(h.mois)}</div><div class="row-amount">${h.montant.toFixed(2)} €</div></div>`).join('') || '<div class="empty-state">Aucun versement pour l\'instant</div>';
  openModal(`
    <button class="close-x" onclick="closeModal()">✕</button>
    <h3>${e.nom} ${e.atteint?'<span class="badge-atteint">Objectif atteint</span>':''}</h3>
    <div class="field"><label>Nom</label><input id="eNom" value="${e.nom}"></div>
    <div class="field"><label>Compte bancaire associé</label><input id="eCompte" value="${e.compte||''}" placeholder="ex: Livret A"></div>
    ${e.sousType==='projet' ? `<div class="field"><label>Objectif (laisser vide = sans objectif)</label><input id="eObjectif" type="number" value="${e.objectif||''}"></div>` : ''}
    ${e.sousType==='charge' ? `<div class="row-sub" style="margin-bottom:10px;">Liée à la charge : ${chargeLiee?chargeLiee.nom:'—'} (objectif recalculé automatiquement)</div>` : ''}
    <div class="field">
      <label>Montant versé ce mois-ci (${monthLabel(state.viewedMonth)})</label>
      <input id="eMontantMois" type="number" value="${e.montantMoisCi||''}">
    </div>
    <div class="row-sub" style="margin-bottom:6px;">Statut : <strong style="color:${e.valide?'var(--accent2)':'var(--sub)'}">${e.valide?'Versé ✓':'Pas encore versé'}</strong></div>
    <div class="row-sub" style="margin-top:6px;">Total cumulé : ${e.cumule.toFixed(2)} € ${e.objectif?('/ '+e.objectif.toFixed(2)+' € — reste '+Math.max(0,e.objectif-e.cumule).toFixed(2)+' €'):''}</div>
    <div class="section-title">Historique des versements</div>
    ${histo}
    <div class="btn-row">
      <button class="secondary" onclick="closeModal()">Fermer</button>
      <button onclick="saveEpargneDetail('${id}')">Enregistrer le versement</button>
    </div>
    ${e.valide ? `<div class="btn-row"><button class="secondary" onclick="cancelVersement('${id}')">Annuler le versement de ce mois</button></div>` : ''}
    ${e.sousType==='projet' ? `<div class="btn-row"><button class="danger" onclick="deleteEpargne('${id}')">Supprimer le projet</button></div>` : ''}
    ${e.atteint && !e.hidden ? `<div class="btn-row"><button class="secondary" onclick="hideProjet('${id}')">Masquer (objectif atteint)</button></div>` : ''}
  `);
}
function saveEpargneDetail(id){
  const m = curMonth();
  const e = m.epargne.find(x=>x.id===id);
  e.nom = document.getElementById('eNom').value.trim() || e.nom;
  e._renamed = true;
  e.compte = document.getElementById('eCompte').value.trim();
  const objInput = document.getElementById('eObjectif');
  if(objInput){ const v = objInput.value; e.objectif = v ? parseFloat(v) : null; }

  const newMontant = parseFloat(document.getElementById('eMontantMois').value)||0;
  const oldContribution = e.valide ? e.montantMoisCi : 0;
  e.cumule += (newMontant - oldContribution);
  e.montantMoisCi = newMontant;
  e.historique = e.historique || [];

  if(newMontant > 0){
    const last = e.historique.length ? e.historique[e.historique.length-1] : null;
    if(e.valide && last && last.mois === state.viewedMonth){
      last.montant = newMontant;
    } else {
      e.historique.push({mois: state.viewedMonth, montant: newMontant});
    }
    e.valide = true;
    if(e.objectif && e.cumule >= e.objectif && e.sousType==='projet'){
      e.atteint = true;
    }
    if(e.sousType==='charge' && e.objectif){
      const validCount = e.historique.length;
      const chargeItem = allChargeItems(m).find(c=>c.id===e.chargeLieeId);
      const cycle = chargeItem ? cycleMonths[chargeItem.frequence] : null;
      if(cycle && validCount >= cycle){
        e.cumule = 0; e.historique = [];
      }
    }
  } else {
    const last = e.historique.length ? e.historique[e.historique.length-1] : null;
    if(e.valide && last && last.mois === state.viewedMonth){ e.historique.pop(); }
    e.valide = false;
  }
  saveDB(); closeModal(); render();
}
function cancelVersement(id){
  const el = document.getElementById('eMontantMois');
  if(el) el.value = 0;
  saveEpargneDetail(id);
}
function deleteEpargne(id){
  const m = curMonth();
  m.epargne = m.epargne.filter(x=>x.id!==id);
  saveDB(); closeModal(); render();
}
function hideProjet(id){
  const m = curMonth();

}
function showAtteintsModal(){

/* ================= LOISIRS & ALIMENTATION/VOITURE (generique) ================= */
function renderVariable(getCats, getDeps, kind, sugFn, valFn, title){
  const m = curMonth();
  const cats = getCats(m);
  const deps = getDeps(m);
  const sug = sugFn(m);
  const val = valFn(m);
  const restant = sug - val;
  const seuil = m.seuilAlerteLoisirs;

  const blocks = cats.map(cat=>{
    const catTotal = deps.filter(d=>d.catId===cat.id).reduce((s,d)=>s+d.montant,0);
    return `<div class="block" onclick="openVariableCategory('${kind}','${cat.id}')">
      <button class="block-edit" onclick="event.stopPropagation();editVariableCategory('${kind}','${cat.id}')">✎</button>
      <h4>${cat.nom}</h4>
      <div class="amt">${catTotal.toFixed(2)} €</div>
      <div class="sub">${cat.items.length} type(s)</div>
    </div>`;
  }).join('');

  let alert = '';
  if(kind==='loisirs' && restant < seuil){
    alert = `<div class="alert-box">⚠️ Vous passez sous le seuil d'alerte (${seuil}€)</div>`;
  }

  return `
    <div class="card">
      <h3>${title}</h3>
      <div class="big-number ${restant<0?'negative':'positive'}">${restant.toFixed(2)} €</div>
      <div class="row-sub">Suggéré: ${sug.toFixed(2)}€ • Dépensé: ${val.toFixed(2)}€</div>
      ${alert}
    </div>
    <div class="section-title">Sous-catégories</div>
    <div class="block-grid">
      ${blocks}
      <div class="block add-block" onclick="addVariableCategoryPrompt('${kind}')">+</div>
    </div>
  `;
}
function getVarData(kind){
  const m = curMonth();
  if(kind==='loisirs') return {cats:m.loisirsCategories, deps:m.loisirsDepenses};
  return {cats:m.alimCategories, deps:m.alimDepenses};
}
function addVariableCategoryPrompt(kind){
  openModal(`
    <button class="close-x" onclick="closeModal()">✕</button>
    <h3>Nouvelle sous-catégorie</h3>
    <div class="field"><label>Nom</label><input id="newVarCatNom" placeholder="ex: Sport"></div>
    <div class="btn-row">
      <button class="secondary" onclick="closeModal()">Annuler</button>
      <button onclick="saveNewVariableCategory('${kind}')">Créer</button>
    </div>
  `);
}
function saveNewVariableCategory(kind){
  const nom = document.getElementById('newVarCatNom').value.trim();
  if(!nom) return;
  getVarData(kind).cats.push({id:uid(), nom, items:['Autre']});
  saveDB(); closeModal(); render();
}
function editVariableCategory(kind, catId){
  const cat = getVarData(kind).cats.find(c=>c.id===catId);
  const chips = cat.items.map(it=>`<span class="chip">${it}<span class="chip-del" onclick="removeVarItem('${kind}','${catId}','${it}')">✕</span></span>`).join('');
  openModal(`
    <button class="close-x" onclick="closeModal()">✕</button>
    <h3>Modifier "${cat.nom}"</h3>
    <div class="field"><label>Nom de la sous-catégorie</label><input id="varCatNomEdit" value="${cat.nom}"></div>
    <button class="secondary" onclick="saveVarCatName('${kind}','${catId}')">Renommer</button>
    <div class="section-title">Types (choix rapides)</div>
    <div class="chip-list">${chips}</div>
    <div class="field"><label>Ajouter un type</label><input id="newVarItem" placeholder="ex: Salle de sport"></div>
    <button onclick="addVarItem('${kind}','${catId}')">+ Ajouter</button>
    <div class="btn-row"><button class="danger" onclick="deleteVariableCategory('${kind}','${catId}')">Supprimer la sous-catégorie</button></div>
  `);
}
function saveVarCatName(kind, catId){
  const cat = getVarData(kind).cats.find(c=>c.id===catId);
  cat.nom = document.getElementById('varCatNomEdit').value.trim()||cat.nom;
  saveDB(); closeModal(); render();
}
function addVarItem(kind, catId){
  const cat = getVarData(kind).cats.find(c=>c.id===catId);
  const val = document.getElementById('newVarItem').value.trim();
  if(!val || cat.items.includes(val)) return;
  cat.items.push(val);
  saveDB(); editVariableCategory(kind, catId);
}
function removeVarItem(kind, catId, item){
  const cat = getVarData(kind).cats.find(c=>c.id===catId);
  cat.items = cat.items.filter(i=>i!==item);
  saveDB(); editVariableCategory(kind, catId);
}
function deleteVariableCategory(kind, catId){
  const data = getVarData(kind);
  data.cats = data.cats.filter(c=>c.id!==catId);
  const m = curMonth();
  if(kind==='loisirs') m.loisirsDepenses = m.loisirsDepenses.filter(d=>d.catId!==catId);
  else m.alimDepenses = m.alimDepenses.filter(d=>d.catId!==catId);
  saveDB(); closeModal(); render();
}
function openVariableCategory(kind, catId){
  const {cats, deps} = getVarData(kind);
  const cat = cats.find(c=>c.id===catId);
  const items = deps.filter(d=>d.catId===catId).slice().reverse();
  const rows = items.map(d=>`
    <div class="row">
      <div><div class="row-title">${d.itemNom}</div><div class="row-sub">${d.detail||''}</div></div>
      <div style="display:flex;align-items:center;gap:8px;">
        <span class="row-amount">${d.montant.toFixed(2)} €</span>
        <button class="ghost" onclick="deleteVarDepense('${kind}','${d.id}')" style="color:var(--danger)">✕</button>
      </div>
    </div>
  `).join('') || '<div class="empty-state">Aucune dépense. Touchez + pour ajouter.</div>';
  openModal(`
    <button class="close-x" onclick="closeModal()">✕</button>
    <h3>${cat.nom}</h3>
    ${rows}
    <div class="btn-row"><button onclick="openVarDepenseForm('${kind}','${catId}')">+ Ajouter une dépense</button></div>
  `);
}
function openVarDepenseForm(kind, catId){
  const cat = getVarData(kind).cats.find(c=>c.id===catId);
  const chips = cat.items.map(it=>`<span class="chip" data-item="${it}" onclick="selectVarChip(this)">${it}</span>`).join('');
  openModal(`
    <button class="close-x" onclick="closeModal()">✕</button>
    <h3>Nouvelle dépense — ${cat.nom}</h3>
    <div class="field"><label>Type</label><div class="chip-list" id="varChips">${chips}</div></div>
    <div class="field" id="customItemField" style="display:none;"><label>Précisez</label><input id="varCustomItem" placeholder="Libellé"></div>
    <div class="field"><label>Montant</label><input id="varMontant" type="number"></div>
    <div class="field"><label>Détail (optionnel)</label><input id="varDetail" placeholder="ex: précision"></div>
    <div class="btn-row">
      <button class="secondary" onclick="closeModal()">Annuler</button>
      <button onclick="saveVarDepense('${kind}','${catId}')">Ajouter</button>
    </div>
  `);
}
function selectVarChip(el){
  document.querySelectorAll('#varChips .chip').forEach(c=>c.classList.remove('selected'));
  el.classList.add('selected');
  const isAutre = el.dataset.item === 'Autre';
  document.getElementById('customItemField').style.display = isAutre ? 'block' : 'none';
}
function saveVarDepense(kind, catId){
  const selected = document.querySelector('#varChips .chip.selected');
  let itemNom = selected ? selected.dataset.item : 'Autre';
  if(itemNom === 'Autre'){
    const custom = document.getElementById('varCustomItem').value.trim();
    if(custom) itemNom = custom;
  }
  const montant = parseFloat(document.getElementById('varMontant').value)||0;
  const detail = document.getElementById('varDetail').value.trim();
  if(montant<=0){ alert('Merci d\'indiquer un montant'); return; }
  const cat = getVarData(kind).cats.find(c=>c.id===catId);
  const dep = {id:uid(), catId, catNom:cat.nom, itemNom, montant, detail};
  const m = curMonth();
  if(kind==='loisirs') m.loisirsDepenses.push(dep);
  else m.alimDepenses.push(dep);
  saveDB(); closeModal(); openVariableCategory(kind, catId); render();
}
function deleteVarDepense(kind, depId){
  const m = curMonth();
  if(kind==='loisirs') m.loisirsDepenses = m.loisirsDepenses.filter(d=>d.id!==depId);
  else m.alimDepenses = m.alimDepenses.filter(d=>d.id!==depId);
  saveDB(); render();
  document.getElementById('modalRoot').innerHTML='';
}

/* ================= ADD BUTTON (Ressources / Charges / Epargne) ================= */
function handleAdd(){
  if(state.page==='ressources'){
    openModal(`
      <button class="close-x" onclick="closeModal()">✕</button>
      <h3>Nouvelle ressource</h3>
      <div class="field"><label>Nom</label><input id="rNom" placeholder="ex: Pension alimentaire"></div>
      <div class="field"><label>Montant mensuel</label><input id="rMontant" type="number"></div>
      <div class="btn-row">
        <button class="secondary" onclick="closeModal()">Annuler</button>
        <button onclick="addRessource()">Ajouter</button>
      </div>
    `);
  } else if(state.page==='charges'){
    addChargeCategoryPrompt();
  } else if(state.page==='epargne'){
    openModal(`
      <button class="close-x" onclick="closeModal()">✕</button>
      <h3>Nouveau projet d'épargne</h3>
      <div class="field"><label>Nom</label><input id="pNom" placeholder="ex: Vacances"></div>
      <div class="field"><label>Compte bancaire (optionnel)</label><input id="pCompte" placeholder="ex: Livret A"></div>
      <div class="field"><label>Objectif (optionnel)</label><input id="pObjectif" type="number" placeholder="Laisser vide si aucun"></div>
      <div class="field"><label>Montant déjà cumulé (optionnel)</label><input id="pCumule" type="number" placeholder="0"></div>
      <div class="btn-row">
        <button class="secondary" onclick="closeModal()">Annuler</button>
        <button onclick="addProjet()">Créer</button>
      </div>
    `);
  }
}
function addRessource(){
  const m = curMonth();
  const nom = document.getElementById('rNom').value.trim() || 'Ressource';
  const montant = parseFloat(document.getElementById('rMontant').value)||0;
  m.autresRessources.push({id:uid(), nom, montant});
  saveDB(); closeModal(); render();
}
function addProjet(){
  const m = curMonth();
  const nom = document.getElementById('pNom').value.trim() || 'Projet';
  const compte = document.getElementById('pCompte').value.trim();
  const objVal = document.getElementById('pObjectif').value;
  const objectif = objVal ? parseFloat(objVal) : null;
  const cumule = parseFloat(document.getElementById('pCumule').value)||0;
  m.epargne.push({id:uid(), nom, sousType:'projet', compte, objectif, cumule, montantMoisCi:0, valide:false, chargeLieeId:null, hidden:false, atteint: objectif ? cumule>=objectif : false, historique:[]});
  saveDB(); closeModal(); render();
}

/* ================= MODAL ================= */
function openModal(html){
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this) closeModal()">
      <div class="modal"><div class="modal-handle"></div>${html}</div>
    </div>
  `;
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }

/* ================= INIT ================= */
render();
</script>
</body>
</html>
